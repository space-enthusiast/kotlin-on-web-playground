<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kotlin on Web Playground</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 760px; margin: 32px auto; padding: 0 16px; }
  textarea { width: 100%; height: 220px; font: 14px/1.5 ui-monospace, Consolas, monospace; box-sizing: border-box; }
  pre { background: #111; color: #ddd; padding: 12px; min-height: 80px; white-space: pre-wrap; }
  .err { color: #ff7b72; }
</style>
</head>
<body>
<h1>Kotlin on Web Playground</h1>
<p>서버 없이 브라우저 안에서 진짜 Kotlin 컴파일러(K2, Wasm으로 변환됨)가 컴파일하고 실행합니다.
첫 Run은 컴파일러(약 75MB)를 내려받느라 시간이 걸립니다.</p>

<textarea id="src" spellcheck="false">import kotlin.math.pow

fun choose(n: Int, k: Int): Long =
    (1..k).fold(1L) { acc, i -> acc * (n - k + i) / i }

fun binomPmf(k: Int, n: Int, p: Double): Double =
    choose(n, k) * p.pow(k) * (1 - p).pow(n - k)

fun main() {
    val n = 2
    for (k in 0..n) println("P(k=$k) = ${binomPmf(k, n, 0.5)}")
}</textarea>
<p><button id="run">Run</button> <span id="status"></span></p>
<pre id="out"></pre>

<script>
const $ = id => document.getElementById(id);
const out = $("out");
const print = (text, cls) => {
  const line = document.createElement("div");
  line.textContent = text;
  if (cls) line.className = cls;
  out.appendChild(line);
};

// 1) 컴파일러 Worker: GraalVM Web Image로 만든 kotlinc.wasm이 이 안에서 돈다.
//    메시지 형식 { id, operation, text } → { id, answer(JSON 문자열) }
let compiler, nextId = 1;
const pending = new Map();
function compile(source) {
  if (!compiler) {
    compiler = new Worker("kotlin-compiler-worker.js");
    compiler.onmessage = ({ data }) => { pending.get(data.id)?.(data.answer); pending.delete(data.id); };
  }
  return new Promise(resolve => {
    const id = nextId++;
    pending.set(id, answer => resolve(JSON.parse(answer)));
    compiler.postMessage({ id, operation: "compile", text: source });
  });
}

// 2) 실행 Worker: 컴파일 결과(main.wasm + .mjs 3개)를 blob URL로 이어 붙여 실행한다.
function run(files, timeoutMs = 10000) {
  const bytes = name => Uint8Array.from(atob(files.find(f => f.name === name).content), c => c.charCodeAt(0));
  const text = name => new TextDecoder().decode(bytes(name));
  const blob = (content, type) => URL.createObjectURL(new Blob([content], { type }));

  // 생성된 모듈은 './main.wasm' 같은 상대 경로로 서로를 부른다 → blob URL로 바꿔치기
  const wasm = blob(bytes("main.wasm"), "application/wasm");
  const builtins = blob(text("main.js-builtins.mjs"), "text/javascript");
  const imports = blob(text("main.import-object.mjs").replaceAll("'./main.js-builtins.mjs'", `'${builtins}'`), "text/javascript");
  const main = blob(text("main.mjs")
    .replaceAll("'./main.import-object.mjs'", `'${imports}'`)
    .replaceAll("new URL('./main.wasm',import.meta.url).href", `'${wasm}'`), "text/javascript");

  // println → console.log 이므로 가로채서 페이지로 보낸다
  const runner = blob(`
    for (const level of ['log', 'info', 'warn', 'error', 'debug'])
      console[level] = (...v) => postMessage({ output: v.map(String).join(' ') });
    try { await import(${JSON.stringify(main)}); postMessage({ done: true }); }
    catch (e) { postMessage({ done: true, error: String(e?.stack || e) }); }
  `, "text/javascript");

  return new Promise(resolve => {
    const worker = new Worker(runner, { type: "module" });
    const finish = error => { clearTimeout(timer); worker.terminate(); resolve(error); };
    const timer = setTimeout(() => finish(`${timeoutMs / 1000}초가 지나 중단했습니다`), timeoutMs);
    worker.onmessage = ({ data }) => data.done ? finish(data.error) : print(data.output);
    worker.onerror = e => finish(e.message);
  });
}

$("run").onclick = async () => {
  const button = $("run");
  button.disabled = true;
  out.textContent = "";
  const started = performance.now();
  $("status").textContent = compiler ? "컴파일 중…" : "컴파일러 내려받고 컴파일 중…";
  try {
    const result = await compile($("src").value);
    if (result.error) throw new Error(result.error);
    for (const d of result.diagnostics) print(`${d.severity}: ${d.message}`, d.severity === "ERROR" ? "err" : "");
    if (result.ok) {
      $("status").textContent = `컴파일 ${result.milliseconds}ms · 실행 중…`;
      const error = await run(result.files);
      if (error) print(error, "err");
    }
    $("status").textContent = `완료 (${Math.round(performance.now() - started)}ms)`;
  } catch (e) {
    print(String(e.message || e), "err");
    $("status").textContent = "실패";
  }
  button.disabled = false;
};
</script>
</body>
</html>
