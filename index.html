<style>
:root {
  --kt: #7f52ff; --kt-2: #e44857; --kt-3: #c711e1;
  --bg: #ffffff; --panel: #f7f7f9; --ink: #19191c; --muted: #6b6b75; --line: #e4e4ea;
  --console-bg: #fbfbfc; --err: #d32f2f; --warn: #b26a00; --ok: #2e7d32;
  --sans: "Inter", system-ui, sans-serif; --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
}
:root[data-theme="dark"] {
  --bg: #19191c; --panel: #222226; --ink: #e8e8ec; --muted: #9a9aa5; --line: #34343a;
  --console-bg: #1e1e21; --err: #ff6b6b; --warn: #ffb74d; --ok: #81c784;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--sans); display: flex; flex-direction: column; }
button, select { font: inherit; color: inherit; }

header { display: flex; align-items: center; gap: 14px; padding: 10px 20px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; margin-right: auto; }
.brand svg { width: 26px; height: 26px; }
.brand small { font-weight: 500; color: var(--muted); font-size: 12.5px; }
.field { display: flex; flex-direction: column; gap: 2px; }
.field label { font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.field .val, .field select { font-family: var(--mono); font-size: 12.5px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
.chip { font-family: var(--mono); font-size: 12px; padding: 4px 10px; border-radius: 99px; border: 1px solid var(--line); background: var(--panel); white-space: nowrap; }
.chip::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; background: var(--muted); vertical-align: 1px; }
.chip.loading::before { background: var(--warn); animation: pulse 1s infinite alternate; }
.chip.ready::before { background: var(--ok); }
.chip.fail::before { background: var(--err); }
@keyframes pulse { to { opacity: .3; } }
.icon-btn { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; cursor: pointer; }
.icon-btn:hover { border-color: var(--kt); }
.run { display: inline-flex; align-items: center; gap: 8px; background: var(--kt); color: #fff; border: 0; border-radius: 6px; padding: 8px 18px; font-weight: 600; cursor: pointer; }
.run:hover { filter: brightness(1.08); }
.run:disabled { opacity: .6; cursor: progress; }
.run svg { width: 12px; height: 12px; }

main { flex: 1; display: grid; grid-template-rows: minmax(0, 1fr) 6px minmax(120px, 34%); min-height: 0; }
.editor-wrap { min-height: 0; position: relative; }
.CodeMirror { height: 100%; font-family: var(--mono); font-size: 14px; line-height: 1.6; }
.cm-s-idea.CodeMirror { background: var(--bg); }
.cm-s-darcula.CodeMirror { background: var(--bg); }
.CodeMirror-gutters { border-right: 1px solid var(--line) !important; background: var(--bg) !important; }
.CodeMirror-lint-markers { width: 14px; }
.resizer { cursor: row-resize; background: var(--line); }
.console { display: flex; flex-direction: column; min-height: 0; background: var(--console-bg); }
.console-head { display: flex; align-items: center; gap: 12px; padding: 6px 20px; border-bottom: 1px solid var(--line); font-size: 12.5px; color: var(--muted); }
.console-head strong { color: var(--ink); font-weight: 600; }
.console-head .sp { margin-left: auto; }
#out { flex: 1; overflow: auto; margin: 0; padding: 12px 20px; font: 13px/1.6 var(--mono); white-space: pre-wrap; }
#out .err { color: var(--err); }
#out .warn { color: var(--warn); }
#out .sys { color: var(--muted); font-style: italic; }
#out a { color: var(--kt); cursor: pointer; text-decoration: underline; }

/* completion popup */
.CodeMirror-hints { font-family: var(--mono); font-size: 13px; border-radius: 6px; padding: 3px 0; max-height: 18em; z-index: 50; background: var(--panel); border: 1px solid var(--line); box-shadow: 0 8px 24px rgba(0,0,0,.18); }
.CodeMirror-hint { color: var(--ink); padding: 2px 10px 2px 6px; display: flex; gap: 8px; align-items: center; max-width: 60ch; }
li.CodeMirror-hint-active { background: var(--kt); color: #fff; }
.hk { width: 18px; height: 18px; border-radius: 4px; display: inline-grid; place-items: center; font-size: 10.5px; font-weight: 700; color: #fff; flex: none; }
.hk.f { background: #e8833a; } .hk.v { background: #9b59b6; } .hk.c { background: #3d8bfd; } .hk.k { background: #6b6b75; } .hk.p { background: #2aa198; } .hk.o { background: #888; }
.hd { color: var(--muted); margin-left: auto; padding-left: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
li.CodeMirror-hint-active .hd { color: rgba(255,255,255,.8); }
.CodeMirror-lint-tooltip { font-family: var(--mono); font-size: 12.5px; z-index: 60; }

footer { padding: 6px 20px; font-size: 11.5px; color: var(--muted); border-top: 1px solid var(--line); }
footer kbd { font-family: var(--mono); background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
@media (max-width: 640px) { header { padding: 10px 12px; } .hide-sm { display: none; } }

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/lint/lint.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/selection/active-line.min.js"></script>
<script>
// ---------- examples ----------
const EXAMPLES = {
  "Hello": `fun main() {
    val name = "Kotlin"
    println("Hello, $name! 이 코드는 브라우저 안에서 컴파일됐어요.")
}`,
  "이항분포 PMF": `import kotlin.math.pow
import kotlin.math.roundToInt

fun choose(n: Int, k: Int): Long =
    (1..k).fold(1L) { acc, i -> acc * (n - k + i) / i }

fun binomPmf(k: Int, n: Int, p: Double): Double =
    choose(n, k) * p.pow(k) * (1 - p).pow(n - k)

fun main() {
    val n = 10
    val p = 0.5
    for (k in 0..n) {
        val prob = binomPmf(k, n, p)
        val bar = "█".repeat((prob * 100).toInt())
        val rounded = (prob * 10000).roundToInt() / 10000.0
        println("k=\${k.toString().padStart(2)}  \${rounded.toString().padEnd(6)}  $bar")
    }
}`,
  "Pmf 클래스": `class Pmf<T>(private val probs: Map<T, Double>) {
    operator fun get(x: T): Double = probs[x] ?: 0.0

    fun normalized(): Pmf<T> {
        val total = probs.values.sum()
        return Pmf(probs.mapValues { it.value / total })
    }

    operator fun times(likelihood: (T) -> Double) =
        Pmf(probs.mapValues { (x, p) -> p * likelihood(x) })

    fun mean(toDouble: (T) -> Double) = probs.entries.sumOf { toDouble(it.key) * it.value }

    override fun toString() = probs.entries.joinToString("\\n") { "\${it.key}\\t\${it.value}" }
}

fun main() {
    // 동전 앞면 확률 가설 0.0, 0.1, ..., 1.0 — 균등 사전분포
    val hypos = (0..10).map { it / 10.0 }
    val prior = Pmf(hypos.associateWith { 1.0 })

    // 앞면 관측 1번 → 사후분포
    val posterior = (prior * { p -> p }).normalized()
    println(posterior)
    println("평균 = \${posterior.mean { it }}")
}`,
  "컬렉션 & data class": `data class Person(val name: String, val age: Int)

fun main() {
    val people = listOf(
        Person("Alice", 29), Person("Bob", 31),
        Person("Carol", 24), Person("Dave", 31),
    )
    val byAge = people.groupBy { it.age }
    println(byAge)
    println(people.maxBy { it.age })
    println(people.sortedBy { it.name }.map { it.name.uppercase() })
}`,
  "컴파일 오류 예시": `fun main() {
    val count: Int = "three"
    println(undefinedThing)
}`
};

// ---------- workers (GraalVM Web Image) ----------
function service(name, chipId) {
  const chip = document.getElementById(chipId);
  let worker = null, nextId = 1, failed = null;
  const pending = new Map();
  function start() {
    if (worker) return;
    worker = new Worker(`kotlin-${name}-worker.js`);
    worker.onmessage = ({ data }) => { const r = pending.get(data.id); pending.delete(data.id); r && r(data.answer); };
    worker.onerror = e => {
      failed = JSON.stringify({ error: e.message || `${name} worker를 불러오지 못했습니다` });
      chip.className = "chip fail"; chip.title = failed;
      for (const r of pending.values()) r(failed);
      pending.clear();
    };
  }
  return {
    get available() { return !failed; },
    request(operation, text, argument = "") {
      start();
      if (failed) return Promise.resolve(JSON.parse(failed));
      return new Promise(resolve => {
        const id = nextId++;
        pending.set(id, answer => {
          const json = JSON.parse(answer);
          if (!json.error) chip.className = "chip ready";
          resolve(json);
        });
        worker.postMessage({ id, operation, text, argument });
      });
    }
  };
}
const compiler = service("compiler", "chip-compiler");
const analysis = service("analysis", "chip-analysis");

// ---------- run compiled program in its own worker ----------
function runProgram(files, onOutput, timeoutMs = 10000) {
  const bytes = name => Uint8Array.from(atob(files.find(f => f.name === name).content), c => c.charCodeAt(0));
  const text = name => new TextDecoder().decode(bytes(name));
  const urls = [];
  const blob = (content, type) => { const u = URL.createObjectURL(new Blob([content], { type })); urls.push(u); return u; };
  const wasm = blob(bytes("main.wasm"), "application/wasm");
  const builtins = blob(text("main.js-builtins.mjs"), "text/javascript");
  const imports = blob(text("main.import-object.mjs").replaceAll("'./main.js-builtins.mjs'", `'${builtins}'`), "text/javascript");
  const main = blob(text("main.mjs")
    .replaceAll("'./main.import-object.mjs'", `'${imports}'`)
    .replaceAll("new URL('./main.wasm',import.meta.url).href", `'${wasm}'`), "text/javascript");
  const runner = blob(`
    for (const level of ['log', 'info', 'warn', 'error', 'debug'])
      console[level] = (...v) => postMessage({ output: v.map(String).join(' '), level });
    try { await import(${JSON.stringify(main)}); postMessage({ done: true }); }
    catch (e) { postMessage({ done: true, error: String(e?.stack || e) }); }`, "text/javascript");
  return new Promise(resolve => {
    const w = new Worker(runner, { type: "module" });
    const finish = error => { clearTimeout(timer); w.terminate(); urls.forEach(URL.revokeObjectURL); resolve(error); };
    const timer = setTimeout(() => finish(`${timeoutMs / 1000}초가 지나 실행을 중단했습니다`), timeoutMs);
    w.onmessage = ({ data }) => data.done ? finish(data.error) : onOutput(data.output, data.level);
    w.onerror = e => finish(e.message || "프로그램을 시작하지 못했습니다");
  });
}

// ---------- editor ----------
const KEYWORDS = "as break class continue do else false for fun if in interface is null object package return super this throw true try typealias val var when while by catch constructor data enum finally import init inline internal lateinit open operator override private protected public sealed suspend vararg companion abstract const".split(" ");
const BUILTINS = "println print readln listOf mutableListOf setOf mapOf mutableMapOf arrayOf emptyList repeat require check error TODO buildString lazy run let apply also with takeIf".split(" ");

let hintSeq = 0, lintSeq = 0;
const editor = CodeMirror.fromTextArea(document.getElementById("code"), {
  mode: "text/x-kotlin", lineNumbers: true, indentUnit: 4, tabSize: 4, indentWithTabs: false,
  matchBrackets: true, autoCloseBrackets: true, styleActiveLine: true,
  gutters: ["CodeMirror-lint-markers"], lint: { getAnnotations: lintAsync, async: true, delay: 400 },
  extraKeys: {
    "Ctrl-Enter": () => run(), "Cmd-Enter": () => run(),
    "Ctrl-Space": cm => cm.showHint({ hint: hintAsync, completeSingle: false }),
    "Tab": cm => cm.somethingSelected() ? cm.indentSelection("add") : cm.replaceSelection("    ", "end")
  }
});

const KIND = k => {
  k = (k || "").toLowerCase();
  if (k.includes("fun") || k.includes("method") || k.includes("constructor")) return ["f", "f"];
  if (k.includes("class") || k.includes("interface") || k.includes("object") || k.includes("type") || k.includes("enum")) return ["c", "C"];
  if (k.includes("prop") || k.includes("field")) return ["p", "p"];
  if (k.includes("var") || k.includes("val") || k.includes("param") || k.includes("local")) return ["v", "v"];
  if (k.includes("keyword")) return ["k", "k"];
  return ["o", "•"];
};
function renderHint(el, _data, item) {
  const [cls, ch] = KIND(item.kind);
  el.innerHTML = `<span class="hk ${cls}">${ch}</span><span></span><span class="hd"></span>`;
  el.children[1].textContent = item.displayText || item.text;
  el.children[2].textContent = item.detail || "";
}

function localHint(cm) {
  const cur = cm.getCursor(), line = cm.getLine(cur.line);
  let start = cur.ch; while (start && /\w/.test(line[start - 1])) start--;
  const word = line.slice(start, cur.ch);
  const idents = new Set(cm.getValue().match(/\b[A-Za-z_]\w*\b/g) || []);
  const pool = [...KEYWORDS.map(k => ({ text: k, kind: "keyword" })), ...BUILTINS.map(b => ({ text: b, kind: "function" })),
    ...[...idents].map(i => ({ text: i, kind: "local" }))];
  const seen = new Set();
  const list = pool.filter(i => i.text.startsWith(word) && i.text !== word && !seen.has(i.text) && seen.add(i.text))
    .slice(0, 60).map(i => ({ ...i, render: renderHint }));
  return { list, from: CodeMirror.Pos(cur.line, start), to: cur };
}

function hintAsync(cm, callback) {
  const seq = ++hintSeq;
  if (!analysis.available) return callback(localHint(cm));
  const offset = cm.indexFromPos(cm.getCursor());
  analysis.request("complete", cm.getValue(), String(offset)).then(res => {
    if (seq !== hintSeq) return;
    if (res.error || !res.items || !res.items.length) return callback(localHint(cm));
    const cur = cm.getCursor();
    const from = typeof res.from === "number" ? cm.posFromIndex(res.from) : localHint(cm).from;
    const typed = cm.getRange(from, cur);
    const list = res.items
      .filter(i => i.label.startsWith(typed) || !typed)
      .slice(0, 200)
      .map(i => ({ text: i.label.replace(/\(.*$/, ""), displayText: i.label, kind: i.kind, detail: i.detail, render: renderHint }));
    callback({ list, from, to: cur });
  });
}
hintAsync.async = true;

editor.on("inputRead", (cm, change) => {
  if (change.origin !== "+input") return;
  const ch = change.text[0].slice(-1);
  if (ch === "." || (/[A-Za-z_]/.test(ch) && !cm.state.completionActive)) {
    const line = cm.getLine(cm.getCursor().line).slice(0, cm.getCursor().ch);
    if (ch === "." || /(^|[^\w])[A-Za-z_]\w?$/.test(line)) cm.showHint({ hint: hintAsync, completeSingle: false });
  }
});

function lintAsync(text, updateLinting, _options, cm) {
  const seq = ++lintSeq;
  if (!analysis.available) return updateLinting([]);
  analysis.request("analyze", text).then(res => {
    if (seq !== lintSeq || res.error) return;
    updateLinting((res.diagnostics || []).map(d => ({
      from: cm.posFromIndex(d.from), to: cm.posFromIndex(Math.max(d.to, d.from + 1)),
      message: d.message, severity: d.severity === "ERROR" ? "error" : "warning"
    })));
  });
}

// ---------- console ----------
const out = document.getElementById("out"), statusEl = document.getElementById("status");
function print(text, cls) { const d = document.createElement("div"); d.textContent = text; if (cls) d.className = cls; out.appendChild(d); out.scrollTop = out.scrollHeight; }
function printDiag(d) {
  const p = editor.posFromIndex(d.from);
  const row = document.createElement("div");
  row.className = d.severity === "ERROR" ? "err" : "warn";
  const a = document.createElement("a");
  a.textContent = `(${p.line + 1}:${p.ch + 1})`;
  a.onclick = () => { editor.focus(); editor.setCursor(p); };
  row.append(`${d.severity === "ERROR" ? "e" : "w"}: `, a, ` ${d.message}`);
  out.appendChild(row);
}
document.getElementById("clear").onclick = () => { out.textContent = ""; };

// ---------- run ----------
const runBtn = document.getElementById("run");
let firstRun = true;
async function run() {
  if (runBtn.disabled) return;
  runBtn.disabled = true;
  out.textContent = "";
  const t0 = performance.now();
  statusEl.textContent = firstRun ? "컴파일러 준비 + 컴파일 중… (첫 실행은 수 초)" : "컴파일 중…";
  try {
    const res = await compiler.request("compile", editor.getValue());
    if (res.error) throw new Error(res.error);
    (res.diagnostics || []).forEach(printDiag);
    if (!res.ok) { statusEl.textContent = `컴파일 실패 · ${res.milliseconds}ms`; return; }
    statusEl.textContent = `컴파일 ${res.milliseconds}ms · 실행 중…`;
    const t1 = performance.now();
    const error = await runProgram(res.files, (line, level) => print(line, level === "error" ? "err" : ""));
    if (error) print(error, "err");
    statusEl.textContent = `컴파일 ${res.milliseconds}ms · 실행 ${Math.round(performance.now() - t1)}ms · 전체 ${Math.round(performance.now() - t0)}ms`;
    firstRun = false;
  } catch (e) {
    print(String(e.message || e), "err");
    statusEl.textContent = "실패";
  } finally {
    runBtn.disabled = false;
  }
}
runBtn.onclick = run;

// ---------- examples, share, theme, resize ----------
const sel = document.getElementById("examples");
for (const name of Object.keys(EXAMPLES)) sel.add(new Option(name, name));
sel.onchange = () => { editor.setValue(EXAMPLES[sel.value]); editor.focus(); };

const enc = s => btoa(String.fromCharCode(...new TextEncoder().encode(s))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
const dec = s => new TextDecoder().decode(Uint8Array.from(atob(s.replace(/-/g, "+").replace(/_/g, "/")), c => c.charCodeAt(0)));
document.getElementById("share").onclick = async () => {
  const url = `${location.origin}${location.pathname}#code=${enc(editor.getValue())}`;
  history.replaceState(null, "", url);
  try { await navigator.clipboard.writeText(url); print("링크를 복사했습니다.", "sys"); }
  catch { print(url, "sys"); }
};
let initial = EXAMPLES["이항분포 PMF"];
const m = location.hash.match(/code=([\w-]+)/);
if (m) { try { initial = dec(m[1]); sel.value = ""; } catch {} } else sel.value = "이항분포 PMF";
editor.setValue(initial);

const root = document.documentElement;
function setTheme(t) {
  root.dataset.theme = t;
  editor.setOption("theme", t === "dark" ? "darcula" : "idea");
  try { localStorage.setItem("kp-theme", t); } catch {}
}
let savedTheme = null; try { savedTheme = localStorage.getItem("kp-theme"); } catch {}
setTheme(savedTheme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
document.getElementById("theme").onclick = () => setTheme(root.dataset.theme === "dark" ? "light" : "dark");

const mainEl = document.querySelector("main");
document.getElementById("resizer").addEventListener("pointerdown", e => {
  e.preventDefault();
  const move = ev => {
    const r = mainEl.getBoundingClientRect();
    const consoleH = Math.min(Math.max(r.bottom - ev.clientY, 80), r.height - 120);
    mainEl.style.gridTemplateRows = `minmax(0,1fr) 6px ${consoleH}px`;
    editor.refresh();
  };
  addEventListener("pointermove", move);
  addEventListener("pointerup", () => removeEventListener("pointermove", move), { once: true });
});

// ---------- warm up: start both workers in the background ----------
print("컴파일러와 분석기를 내려받는 중입니다 (처음 한 번, 약 160MB). 준비되면 위 표시가 초록색이 됩니다.", "sys");
analysis.request("analyze", editor.getValue()).then(() => editor.performLint && editor.performLint());
compiler.request("compile", "fun main() {}").then(res => {
  if (!res.error) { out.textContent = ""; print("준비 완료. Run(Ctrl+Enter)을 눌러 보세요.", "sys"); firstRun = false; }
});
</script>
